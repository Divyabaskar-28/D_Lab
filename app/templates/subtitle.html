<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subtitle to Voice - D Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
min-height:100vh;
background:linear-gradient(135deg,#000000,#0f2027,#203a43);
color:#fff;
}
.navbar{
height:70px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}
.logo{
display:flex;
align-items:center;
}
.logo img{
max-height:90px;
}
.back{
text-decoration:none;
color:#00f2fe;
font-weight:500;
}
.container{
max-width:900px;
margin:40px auto;
padding:20px;
}
.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
padding:40px;
border-radius:15px;
box-shadow:0 0 30px rgba(0,255,255,0.15);
margin-bottom:30px;
}
.upload-box{
border:2px dashed #00f2fe;
padding:40px;
text-align:center;
border-radius:12px;
margin-bottom:20px;
}
.voice-select{
margin-bottom:20px;
text-align:center;
}
select{
padding:10px;
border-radius:8px;
border:none;
}
button{
padding:12px 25px;
border-radius:8px;
border:none;
background:linear-gradient(90deg,#00f2fe,#4facfe);
color:#000;
font-weight:600;
cursor:pointer;
}
.text-output{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:10px;
max-height:250px;
overflow-y:auto;
}
audio{
width:100%;
margin-top:10px;
}
</style>
</head>

<body>

<div class="navbar">
<div class="logo">
<img src="{{ url_for('static', filename='aiRat_1.webp') }}">
<b>AI Rat</b>
</div>
<a href="/logout" class="back">Logout</a>
</div>

<div class="container">

<div class="card">

<h2>Subtitle to Voice Tool 🎙</h2>

<!-- ONLY CHANGED PARTS SHOWN FULL -->

<form id="voice-form" enctype="multipart/form-data" autocomplete="off">

<div class="voice-select">
<label style="font-size:22px;">Select Voice:</label><br><br>

<select name="voice" required>
<option disabled selected>Select Male Voice</option>
<option value="en-US-GuyNeural">Guy (US)</option>

<option value="en-GB-RyanNeural">Ryan (UK)</option>
<option value="en-GB-ThomasNeural">Thomas (UK)</option>
<option value="en-AU-WilliamNeural">William (AU)</option>
<option value="en-IN-PrabhatNeural">Prabhat (India)</option>
</select>
</div>

<div class="upload-box">
<p>Upload your .SRT subtitle file</p>
<input type="file" name="subtitle_file" accept=".srt" required>
</div>

<!-- 🔥 BUTTONS SIDE BY SIDE -->
<div style="text-align:center; display:flex; justify-content:center; gap:15px;">
<button type="submit" id="generate-btn">🎧 Generate Audio</button>
<button type="button" id="cancel-btn" onclick="cancelProcess()" style="display:none;">
❌ Cancel
</button>
</div>

</form>

<!-- RESULT -->
<div id="result-container"></div>

<!-- PROGRESS -->
<div id="progress-container" style="display:none; margin-top:25px; text-align:center;">
<h3>Generating Audio...</h3>

<div style="width:100%;height:20px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;">
<div id="progress-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#00f2fe,#4facfe);"></div>
</div>

<p style="margin-top:10px;">
<span id="progress-text">0%</span>
</p>
</div>

</div>
</div>

<script>
let controller; // 🔥 global controller

function refreshPage() {
    location.reload();
}

function cancelProcess() {

    // 🔥 stop frontend request
    if (controller) {
        controller.abort();
    }

    // 🔥 stop backend process
    fetch("/cancel", { method: "POST" })
.then(() => {

    progressContainer.style.display = "none";
    document.getElementById("cancel-btn").style.display = "none";
    document.getElementById("generate-btn").disabled = false;

    progressBar.style.width = "0%";
    progressText.innerText = "0%";

    form.reset(); // 🔥 reset form properly
});

}

const form = document.getElementById("voice-form");
const progressContainer = document.getElementById("progress-container");
const progressBar = document.getElementById("progress-bar");
const progressText = document.getElementById("progress-text");
const resultContainer = document.getElementById("result-container");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    controller = new AbortController(); // 🔥 create controller
    document.getElementById("generate-btn").disabled = true;
    progressBar.style.width = "0%";
    progressText.innerText = "0%";

    progressContainer.style.display = "block";
    document.getElementById("cancel-btn").style.display = "inline-block";
    const formData = new FormData(form);

    fetch("/subtitle-to-voice", {
        method: "POST",
        body: formData,
        signal: controller.signal // 🔥 attach signal
    })
    .then(res => {
    return res.json().then(data => {
        if (!res.ok) throw new Error(data.error || "Server Error");
        return data;
    });
})
    .then(data => {

        progressContainer.style.display = "none";
        document.getElementById("cancel-btn").style.display = "none";

        document.getElementById("generate-btn").disabled = false;

        resultContainer.innerHTML = `
        <div class="card">
            <h3>Extracted Text</h3>
            <div class="text-output">${data.text}</div>
        </div>

        <div class="card">
            <h3>Generated Audio</h3>
            <audio controls>
                <source src="/static/${data.audio}" type="audio/mpeg">
            </audio>

            <br><br>

            <div style="display:flex; justify-content:center; gap:15px;">
                <a href="/static/${data.audio}" download>
                    <button>⬇️ Download Audio</button>
                </a>

                <button onclick="refreshPage()">🔄 Generate New</button>
            </div>
        </div>
        `;

    })
   .catch(err => {

        progressContainer.style.display = "none";

        // ✅ HIDE CANCEL BUTTON
        document.getElementById("cancel-btn").style.display = "none";
        document.getElementById("generate-btn").disabled = false;

        if (err.name === "AbortError") {
            console.log("Request cancelled");
        } else {
            alert("Error: " + err.message);
        }
    });

});

// progress updater
setInterval(() => {
    fetch("/progress")
    .then(res => res.json())
    .then(data => {
        progressBar.style.width = data.percent + "%";
        progressText.innerText = data.percent + "%";
    })
    .catch(() => {});
}, 1000);

</script>

</body>
</html>
